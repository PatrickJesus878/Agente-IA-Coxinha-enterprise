name: Acordar o Agente Coxinha

on:
  schedule:
    # O GitHub usa o horário UTC (Londres/Greenwich). 
    # 00h30 e 12h30 no horário de Brasília (UTC-3) correspondem a 03h30 e 15h30 no UTC.
    - cron: '30 3,15 * * *'
  workflow_dispatch: # Permite que você ative o robô manualmente se quiser testar

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar o Navegador Chrome no Servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar as bibliotecas do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Robô Despertador
        run: python cron.py
